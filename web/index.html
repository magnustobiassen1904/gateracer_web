<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gateracer — Kongsberg</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f1220; color: #eef0f6; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  #topbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 14px; min-height: 36px; background: rgba(12,14,26,.94); border-bottom: 1px solid #262a40; z-index: 10; }
  #topbar h1 { font-size: 16px; margin: 0 10px 0 0; font-weight: 800; letter-spacing: .3px; }
  #topbar .hint { color: #aab0c8; font-size: 13px; flex: 1 1 200px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, select, input { background: #2a2f4a; color: #fff; border: 1px solid #3c4266; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  input { cursor: text; width: 120px; }
  button:hover { background: #363c5c; }
  button.primary { background: #e0333a; border-color: #ff5c62; font-weight: 700; }
  button.primary:disabled { background: #4a2a2c; border-color: #5a3a3c; color: #a08a8c; cursor: default; }
  button.active { background: #b8862b; border-color: #e0a63a; }
  label.chk { font-size: 13px; color: #c8cde0; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  #draw, #race { position: relative; flex: 1; min-height: 0; }
  #race { display: none; }
  canvas { display: block; }
  #map { width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #hud { position: absolute; left: 16px; top: 16px; background: rgba(12,14,26,.85); border-radius: 12px; padding: 10px 16px; min-width: 210px; pointer-events: none; }
  #hud .big { font-size: 30px; font-weight: 800; }
  #hud .row { font-size: 14px; color: #c8cde0; margin-top: 2px; }
  #hud .sec { font-size: 13px; color: #aab0c8; margin-top: 6px; font-variant-numeric: tabular-nums; }
  #hud .sec b { color: #fff; }
  .neg { color: #4ee07a !important; } .pos { color: #ff6b6b !important; }
  #speed { position: absolute; right: 16px; bottom: 16px; background: rgba(12,14,26,.85); border-radius: 12px; padding: 8px 18px; text-align: right; pointer-events: none; }
  #speed .v { font-size: 44px; font-weight: 800; line-height: 1; }
  #speed .u { font-size: 13px; color: #aab0c8; }
  #keys { position: absolute; left: 16px; bottom: 16px; font-size: 13px; color: #aab0c8; background: rgba(12,14,26,.7); padding: 8px 12px; border-radius: 10px; pointer-events: none; }
  #msg { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 40px; font-weight: 800; text-shadow: 0 2px 12px #000; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f1220; z-index: 20; font-size: 18px; color: #aab0c8; }
  #stats { position: absolute; right: 16px; top: 236px; font-size: 12px; color: #8b91ad; background: rgba(12,14,26,.7); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  #touch { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 0 12px 18px; pointer-events: none; }
  .tgrp { display: flex; gap: 10px; pointer-events: auto; }
  .tb { width: 74px; height: 74px; border-radius: 50%; font-size: 26px; background: rgba(20,24,40,.75); border: 2px solid #4a5480; touch-action: none; user-select: none; -webkit-user-select: none; }
  .tb.down { background: #e0333a; }
  #credit { position: fixed; right: 10px; bottom: 4px; font-size: 11px; color: #6c7290; z-index: 5; pointer-events: none; }
  @media (pointer: coarse) { #keys { display: none; } #speed { bottom: 110px; } }
  @media (max-width: 700px) {
    #topbar { padding: 6px 8px; gap: 5px; } #topbar h1 { display: none; } #topbar .hint { flex-basis: 100%; font-size: 12px; order: 9; }
    button, select, input { padding: 6px 9px; font-size: 12px; } input { width: 90px; }
    #hud { padding: 6px 10px; min-width: 150px; } #hud .big { font-size: 22px; } #hud .row, #hud .sec { font-size: 12px; }
    #minimap { width: 120px; height: 120px; } #stats { display: none; } #credit { font-size: 9px; }
    #speed .v { font-size: 30px; } #msg { font-size: 26px; }
  }
  #minimap { position: absolute; right: 16px; top: 16px; width: 210px; height: 210px; border-radius: 12px; background: rgba(12,14,26,.85); pointer-events: none; }
</style>
</head>
<body>
<div id="loading">Laster kartdata …</div>
<div id="topbar">
  <h1>GATERACER</h1>
  <span class="hint" id="hint"></span>
  <select id="trackList"><option value="">Mine løyper…</option></select>
  <input id="trackName" placeholder="Navn på løype">
  <button id="btnSave" title="Lagre løypa i nettleseren">Lagre</button>
  <button id="btnShare" title="Kopier en lenke som åpner spillet med denne løypa">Del lenke</button>
  <button id="btnDemo">Eksempel: sentrum</button>
  <button id="btnDemo2">Eksempel: Funkelia</button>
  <button id="btnDemo3">Eksempel: Teknologiparken</button>
  <label class="chk"><input type="checkbox" id="loopChk" checked style="width:auto"> Sløyfe</label>
  <button id="btnHouse" title="Klikk på hus for å fjerne dem fra spillet">Fjern hus</button>
  <button id="btnUndo">Angre</button>
  <button id="btnClear">Nullstill</button>
  <button id="btnRace" class="primary" disabled>Kjør!</button>
  <button id="btnBack" style="display:none">← Tegn ny løype</button>
</div>
<div id="draw"><canvas id="map"></canvas></div>
<div id="race" style="touch-action:none">
  <div id="hud">
    <div class="big" id="lapTime">0:00.00</div>
    <div class="row" id="lapNo">Runde 1</div>
    <div class="row" id="lastLap">Sist: –</div>
    <div class="row" id="bestLap">Best: –</div>
    <div class="sec" id="sectors"></div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="stats"></div>
  <div id="speed"><div class="v" id="spd">0</div><div class="u">km/h</div></div>
  <div id="keys">Piltaster / WASD kjører · R = tilbake til start · Mellomrom = håndbrekk</div>
  <div id="msg"></div>
  <div id="touch">
    <div class="tgrp"><button class="tb" id="tLeft">◀</button><button class="tb" id="tRight">▶</button></div>
    <div class="tgrp"><button class="tb" id="tReset">R</button><button class="tb" id="tBrake">▼</button><button class="tb" id="tGas">▲</button></div>
  </div>
</div>
<div id="credit">Kart © OpenStreetMap-bidragsytere (ODbL) · Høydedata © Kartverket (CC BY 4.0)</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
