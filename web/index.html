<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateracer — Kongsberg</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f1220; color: #eef0f6; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(12,14,26,.92); border-bottom: 1px solid #262a40; z-index: 10; }
  #topbar h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 700; letter-spacing: .3px; }
  #topbar .hint { color: #aab0c8; font-size: 13px; flex: 1; }
  button { background: #2a2f4a; color: #fff; border: 1px solid #3c4266; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #363c5c; }
  button.primary { background: #e0333a; border-color: #ff5c62; font-weight: 700; }
  button.primary:disabled { background: #4a2a2c; border-color: #5a3a3c; color: #a08a8c; cursor: default; }
  #draw, #race { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; }
  #race { display: none; }
  canvas { display: block; }
  #map { width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #hud { position: absolute; left: 16px; top: 16px; background: rgba(12,14,26,.85); border-radius: 12px; padding: 10px 16px; min-width: 190px; pointer-events: none; }
  #hud .big { font-size: 28px; font-weight: 700; }
  #hud .row { font-size: 14px; color: #c8cde0; margin-top: 2px; }
  #speed { position: absolute; right: 16px; bottom: 16px; background: rgba(12,14,26,.85); border-radius: 12px; padding: 8px 18px; text-align: right; pointer-events: none; }
  #speed .v { font-size: 44px; font-weight: 800; line-height: 1; }
  #speed .u { font-size: 13px; color: #aab0c8; }
  #keys { position: absolute; left: 16px; bottom: 16px; font-size: 13px; color: #aab0c8; background: rgba(12,14,26,.7); padding: 8px 12px; border-radius: 10px; pointer-events: none; }
  #msg { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); font-size: 40px; font-weight: 800; text-shadow: 0 2px 12px #000; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f1220; z-index: 20; font-size: 18px; color: #aab0c8; }
  #stats { position: absolute; right: 16px; top: 16px; font-size: 12px; color: #8b91ad; background: rgba(12,14,26,.7); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">Laster kartdata …</div>
<div id="topbar">
  <h1>GATERACER</h1>
  <span class="hint" id="hint">Klikk på veier for å legge punkter. Løypa snapper til gatenettet og lukkes automatisk. Dra for å flytte, rull for å zoome.</span>
  <button id="btnDemo">Eksempel-løype</button>
  <button id="btnUndo">Angre punkt</button>
  <button id="btnClear">Nullstill</button>
  <button id="btnRace" class="primary" disabled>Kjør!</button>
  <button id="btnBack" style="display:none">← Tegn ny løype</button>
</div>
<div id="draw"><canvas id="map"></canvas></div>
<div id="race">
  <div id="hud">
    <div class="big" id="lapTime">0:00.00</div>
    <div class="row" id="lapNo">Runde 1</div>
    <div class="row" id="lastLap">Sist: –</div>
    <div class="row" id="bestLap">Best: –</div>
  </div>
  <div id="stats"></div>
  <div id="speed"><div class="v" id="spd">0</div><div class="u">km/h</div></div>
  <div id="keys">Piltaster / WASD kjører · R = tilbake til start · Mellomrom = håndbrekk</div>
  <div id="msg"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
